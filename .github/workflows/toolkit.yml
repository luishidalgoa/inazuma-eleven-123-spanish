# CI del toolkit ie123kit.
# Norma 2 (CLAUDE.md, LEGAL.md): esta CI nunca descarga ROMs ni datos extraídos;
# la guardia `git` falla si se rastrea alguno. Los tests `requiere_rom` se excluyen.
# Bloqueo tipográfico v20 (AGENTS.md): la guardia `bloqueados` exige que los 5
# ficheros congelados coincidan byte a byte; no desactivar esta comprobación.
#
# OJO con el filtro `paths` de abajo: en GitHub Actions se aplica al workflow
# entero, no a un job suelto, así que este workflow NO se dispara con commits
# fuera de tools/. Las guardias de alcance de repositorio (Norma 2 anti-ROM y
# bloqueo v20) viven además en `.github/workflows/guardia.yml`, que se ejecuta
# en todos los commits sin filtro de rutas; los pasos de guardia de aquí son una
# repetición barata para los commits de tools/. Si se amplía el alcance de este
# workflow, mantener guardia.yml: es el que cubre translation/, docs/ y las
# carpetas nuevas.
name: Toolkit ie123kit

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/toolkit.yml"
      - ".gitattributes"
      - "AGENTS.md"
      - "CLAUDE.md"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/toolkit.yml"
      - ".gitattributes"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Desactivar autocrlf (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Instalar ie123kit
        run: python -m pip install -e "tools[dev]"

      - name: Guardia de ficheros bloqueados
        run: python -X utf8 -m ie123kit.nucleo.compat.guardia bloqueados

      - name: Guardia de ficheros rastreados (Norma 2)
        run: python -X utf8 -m ie123kit.nucleo.compat.guardia git

      - name: Comprobar que no vuelven los shims (retirados en la F2.7)
        run: python -X utf8 -m ie123kit.nucleo.compat.shims comprobar

      # tools/pyproject.toml excluye los 5 ficheros bloqueados v20, y documenta
      # en per-file-ignores por qué las fachadas de _legado/ y servicio/api.py se salvan de
      # dos reglas concretas. Con `ruff>=0.5,<0.17` el conjunto de reglas no cambia solo.
      - name: Lint (ruff)
        run: python -X utf8 -m ruff check tools

      - name: Tests (sin ROM)
        run: python -X utf8 -m pytest tools/tests -m "not requiere_rom" -q

      # Puerta (1) de todas las fases de docs/toolkit/ESPECIFICACION.md. Ojo: «Ran 0 tests»
      # devuelve 0, así que este paso solo detecta fallos, no la pérdida del descubrimiento
      # (lo que pasó al trasladar los tests heredados en F1.5). De que se recojan se encarga
      # tools/tests/arquitectura/test_descubrimiento_unittest.py, en el paso anterior.
      - name: Tests heredados (unittest discover)
        run: python -X utf8 -m unittest discover -s tools -p "test_*.py"
